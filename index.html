<script type="text/babel" data-presets="react">
const {useState, useEffect, useMemo, useCallback, useRef} = React;

function usePersistentState(key, initial){
  const [state, setState] = useState(() => {
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    }catch(e){ return initial; }
  });
  useEffect(() => {
    try{ localStorage.setItem(key, JSON.stringify(state)); }catch(e){}
  }, [key, state]);
  return [state, setState];
}

function useFirestoreCollection(name, seeds){
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const timers = useRef({});
  const seededRef = useRef(false);

  useEffect(() => {
    const colRef = window.FB.collection(window.FB.db, name);
    const unsub = window.FB.onSnapshot(colRef, snap => {
      const docs = snap.docs.map(d => ({id: d.id, ...d.data()}));
      setItems(docs);
      setLoaded(true);
      if(docs.length === 0 && !seededRef.current && seeds && seeds.length){
        seededRef.current = true;
        seeds.forEach(s => {
          const {id, ...rest} = s;
          window.FB.setDoc(window.FB.doc(window.FB.db, name, id), rest).catch(console.error);
        });
      }
    }, err => console.error(`Firestore (${name}):`, err));
    return () => unsub();
  }, [name]);

  const update = useCallback((updatedItem) => {
    const {id, ...patch} = updatedItem;
    setItems(prev => prev.map(it => it.id===id ? {...it, ...patch} : it));
    clearTimeout(timers.current[id]);
    timers.current[id] = setTimeout(() => {
      window.FB.updateDoc(window.FB.doc(window.FB.db, name, id), patch).catch(console.error);
    }, 350);
  }, [name]);

  const add = useCallback((data) => {
    return window.FB.addDoc(window.FB.collection(window.FB.db, name), data).catch(console.error);
  }, [name]);

  const remove = useCallback((id) => {
    clearTimeout(timers.current[id]);
    setItems(prev => prev.filter(it => it.id !== id));
    window.FB.deleteDoc(window.FB.doc(window.FB.db, name, id)).catch(console.error);
  }, [name]);

  return {items, loaded, update, add, remove};
}

function useTheme(){
  const [theme, setTheme] = usePersistentState("pacc_theme", "dark");
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);
  return [theme, setTheme];
}

const uid = () => Math.random().toString(36).slice(2,10);
const nowIso = () => new Date().toISOString();
const fmtTime = (iso) => {
  if(!iso) return "";
  const d = new Date(iso);
  const sameDay = d.toDateString() === new Date().toDateString();
  const time = d.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
  return sameDay ? `today, ${time}` : `${d.toLocaleDateString(undefined,{month:"short", day:"numeric"})}, ${time}`;
};
function withStatus(msg, newStatus){
  if(msg.status === newStatus) return msg;
  const entry = {status:newStatus, at: nowIso()};
  return {...msg, status:newStatus, history:[...(msg.history||[]), entry]};
}

// EMPTIED SEED DATA FOR PRODUCTION
const SEED_MESSAGES = [];
const SEED_PROJECTS = [];
const SEED_MEETINGS = [];

function Pill({children, tone="default"}){
  const tones = {
    default:{bg:"var(--panel2)", fg:"var(--ink-soft)", bd:"var(--border)"},
    accent:{bg:"var(--accent-soft)", fg:"var(--accent)", bd:"var(--accent)"},
    good:{bg:"var(--good-soft)", fg:"var(--good)", bd:"var(--good)"},
    warn:{bg:"var(--warn-soft)", fg:"var(--warn)", bd:"var(--warn)"},
  };
  const t = tones[tone];
  return (
    <span className="text-xs font-medium px-2 py-0.5 rounded-full border whitespace-nowrap"
      style={{background:t.bg, color:t.fg, borderColor:t.bd}}>
      {children}
    </span>
  );
}

function IconBtn({onClick, children, tone="default", disabled, type="button"}){
  const tones = {
    default:{bg:"var(--panel2)", fg:"var(--ink)", bd:"var(--border)"},
    accent:{bg:"var(--accent)", fg:"#fff", bd:"var(--accent)"},
    good:{bg:"var(--good)", fg:"#0d150f", bd:"var(--good)"},
    ghost:{bg:"transparent", fg:"var(--ink-soft)", bd:"var(--border)"},
    danger:{bg:"var(--warn-soft)", fg:"var(--warn)", bd:"var(--warn)"},
  };
  const t = tones[tone];
  return (
    <button onClick={onClick} disabled={disabled} type={type}
      className="text-sm font-medium px-3 py-1.5 rounded-md border transition-opacity hover:opacity-80 disabled:opacity-40 disabled:cursor-not-allowed"
      style={{background:t.bg, color:t.fg, borderColor:t.bd}}>
      {children}
    </button>
  );
}

function DeleteButton({onDelete, label="Delete"}){
  const [confirming, setConfirming] = useState(false);
  useEffect(() => {
    if(!confirming) return;
    const t = setTimeout(()=>setConfirming(false), 4000);
    return () => clearTimeout(t);
  }, [confirming]);
  return confirming
    ? <IconBtn tone="danger" onClick={()=>{ onDelete(); setConfirming(false); }}>Confirm?</IconBtn>
    : <IconBtn tone="ghost" onClick={()=>setConfirming(true)}>{label}</IconBtn>;
}

function copyToClipboard(text){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

const STATUS_META = {
  backlog:{label:"Needs Review", tone:"warn"},
  rewrite:{label:"Rewrite Needed", tone:"warn"},
  approved:{label:"Approved", tone:"good"},
  sent:{label:"Sent", tone:"default"},
};

function MessageCard({msg, onUpdate, onDelete}){
  const [copied, setCopied] = useState(false);
  // Bulletproof fallback in case status is missing or corrupted
  const meta = STATUS_META[msg.status] || STATUS_META.backlog;

  const handleApprove = () => {
    onUpdate(withStatus({...msg, final: msg.final || msg.suggested}, "approved"));
  };

  const handleCopyFinal = () => {
    const text = (msg.final && typeof msg.final === 'string' && msg.final.trim()) ? msg.final : msg.suggested;
    copyToClipboard(text || "");
    setCopied(true);
    setTimeout(()=>setCopied(false), 1600);
  };

  const lastEvent = (msg.history && msg.history.length) ? msg.history[msg.history.length-1] : null;

  return (
    <div className="rounded-lg border p-4 flex flex-col gap-3" style={{background:"var(--panel)", borderColor:"var(--border)"}}>
      <div className="flex items-start justify-between gap-2">
        <div className="w-full">
          <input 
            className="text-lg font-semibold bg-transparent border-none p-0 w-full focus:ring-0 mb-5" 
            style={{color:"var(--ink)"}}
            placeholder="Sender Name"
            value={msg.from || ""} 
            onChange={e=>onUpdate({...msg, from:e.target.value})} 
          />
          <select 
            className="text-xs font-medium px-2 py-1 rounded border focus:ring-0 cursor-pointer" 
            style={{
              background: msg.channel==="Work" ? "var(--accent-soft)" : "var(--panel2)",
              color: msg.channel==="Work" ? "var(--accent)" : "var(--ink-soft)", 
              borderColor: msg.channel==="Work" ? "var(--accent)" : "var(--border)"
            }}
            value={msg.channel || "Work"}
            onChange={e=>onUpdate({...msg, channel:e.target.value})}
          >
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
          </select>
        </div>
        <Pill tone={meta.tone}>{meta.label}</Pill>
      </div>

      <div className="text-xs flex flex-wrap gap-x-3 gap-y-0.5 -mt-1" style={{color:"var(--ink-soft)"}}>
        <span>Added {fmtTime(msg.createdAt)}</span>
        {lastEvent && lastEvent.status !== "backlog" && (
          <span>· {(STATUS_META[lastEvent.status] || {}).label || "Updated"} {fmtTime(lastEvent.at)}</span>
        )}
      </div>

      <div>
        <div className="text-xs uppercase tracking-wide mb-1" style={{color:"var(--ink-soft)"}}>Original message</div>
        <textarea
          className="w-full text-sm rounded-md p-2.5 leading-relaxed resize-y min-h-[56px]"
          value={msg.original || ""}
          onChange={e=>onUpdate({...msg, original:e.target.value})}
        />
      </div>

      <div>
        <div className="text-xs uppercase tracking-wide mb-1" style={{color:"var(--ink-soft)"}}>Suggested response (Draft)</div>
        <textarea
          className="w-full text-sm rounded-md p-2.5 leading-relaxed resize-y min-h-[64px]"
          value={msg.suggested || ""}
          onChange={e=>onUpdate({...msg, suggested:e.target.value})}
        />
      </div>

      <div>
        <div className="text-xs uppercase tracking-wide mb-1" style={{color:"var(--ink-soft)"}}>Final response</div>
        <textarea
          className="w-full text-sm rounded-md p-2.5 leading-relaxed resize-y min-h-[64px]"
          placeholder="Leave blank to send the suggested draft as-is"
          value={msg.final || ""}
          onChange={e=>onUpdate({...msg, final:e.target.value})}
        />
      </div>

      <div className="flex flex-wrap gap-2 pt-1">
        {msg.status !== "approved" && msg.status !== "sent" && (
          <IconBtn tone="good" onClick={handleApprove}>Approve</IconBtn>
        )}
        {(msg.status === "approved" || msg.status === "sent") && (
          <IconBtn tone="accent" onClick={handleCopyFinal}>
            {copied ? "Copied ✓" : "Copy Final"}
          </IconBtn>
        )}
        <IconBtn onClick={()=>onUpdate(withStatus(msg, "rewrite"))}>Needs Rewrite</IconBtn>
        <IconBtn tone={msg.status==="sent"?"good":"ghost"}
          onClick={()=>onUpdate(withStatus(msg, msg.status==="sent" ? "approved" : "sent"))}>
          {msg.status==="sent" ? "Marked Sent ✓" : "Mark as Sent"}
        </IconBtn>
        <DeleteButton onDelete={()=>onDelete(msg.id)} />
      </div>
    </div>
  );
}

function MessageTriage({messages, onUpdate, onAdd, onDelete}){
  const [filter, setFilter] = useState("all");
  const addMessage = () => {
    onAdd({channel:"Work", from:"", original:"", suggested:"", final:"", status:"backlog", createdAt: nowIso(), history:[{status:"backlog", at: nowIso()}]});
  };

  const counts = useMemo(() => {
    const c = {backlog:0, rewrite:0, approved:0, sent:0};
    messages.forEach(m => {
      const stat = m.status || "backlog";
      c[stat] = (c[stat]||0)+1;
    });
    return c;
  }, [messages]);

  const filtered = filter==="all" ? messages : messages.filter(m=>m.status===filter);

  return (
    <section>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div>
          <h2 className="text-lg font-semibold">Message Triage</h2>
          <p className="text-sm" style={{color:"var(--ink-soft)"}}>Backlog first. Draft, approve, copy, send.</p>
        </div>
        <div className="flex flex-wrap gap-2 items-center">
          {["all","backlog","rewrite","approved","sent"].map(k=>(
            <button key={k} onClick={()=>setFilter(k)}
              className="text-xs px-2.5 py-1 rounded-full border whitespace-nowrap"
              style={{
                background: filter===k ? "var(--accent)" : "var(--panel2)",
                color: filter===k ? "#fff" : "var(--ink-soft)",
                borderColor: filter===k ? "var(--accent)" : "var(--border)"
              }}>
              {k==="all" ? `All (${messages.length})` : `${STATUS_META[k].label} (${counts[k]||0})`}
            </button>
          ))}
          <IconBtn tone="ghost" onClick={addMessage}>+ New message</IconBtn>
        </div>
      </div>
      <div className="grid gap-4" style={{gridTemplateColumns:"repeat(auto-fill, minmax(320px, 1fr))"}}>
        {filtered.length === 0 && (
          <div className="text-sm p-6 rounded-lg border" style={{color:"var(--ink-soft)", borderColor:"var(--border)"}}>
            Nothing here right now.
          </div>
        )}
        {filtered.map(m => <MessageCard key={m.id} msg={m} onUpdate={onUpdate} onDelete={onDelete} />)}
      </div>
    </section>
  );
}

function ProjectRow({project, onUpdate, onDelete}){
  return (
    <div className="rounded-lg border p-4" style={{background:"var(--panel)", borderColor:"var(--border)"}}>
      <div className="flex items-start justify-between gap-3">
        <input
          className="text-sm font-semibold bg-transparent border-none p-0 flex-1 focus:ring-0"
          style={{color:"var(--ink)"}}
          placeholder="Project Name"
          value={project.name || ""}
          onChange={e=>onUpdate({...project, name:e.target.value})}
        />
        <div className="flex items-center gap-3 shrink-0">
          <label className="flex items-center gap-1.5 text-xs" style={{color:"var(--ink-soft)"}}>
            <input type="checkbox" checked={!!project.activeToday}
              onChange={e=>onUpdate({...project, activeToday:e.target.checked})}
              className="h-4 w-4 rounded" />
            Active
          </label>
          <DeleteButton onDelete={()=>onDelete(project.id)} />
        </div>
      </div>
      <textarea
        className="w-full text-sm rounded-md p-2 mt-3 resize-y min-h-[44px]"
        placeholder="What moved on this yesterday / today?"
        value={project.lastTask || ""}
        onChange={e=>onUpdate({...project, lastTask:e.target.value})}
      />
      {project.lastTask && (
        <div className="mt-2">
          <div className="text-xs mb-1" style={{color:"var(--ink-soft)"}}>Next step for {project.name || "this project"}?</div>
          <input
            className="w-full text-sm rounded-md p-2"
            placeholder="Ask for clarity at stand-up"
            value={project.nextStep || ""}
            onChange={e=>onUpdate({...project, nextStep:e.target.value})}
          />
        </div>
      )}
    </div>
  );
}

function StandUp({projects, onUpdate, onAdd, onDelete}){
  // Bulletproof active check
  const activeCount = projects.filter(p=>p && p.activeToday).length;
  const lowMomentum = activeCount < 2;

  const addProject = () => {
    onAdd({name:"", activeToday:false, lastTask:"", nextStep:""});
  };

  return (
    <section>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div>
          <h2 className="text-lg font-semibold">Daily Stand-Up & Project Tracker</h2>
          <p className="text-sm" style={{color:"var(--ink-soft)"}}>Track active projects daily.</p>
        </div>
        <div className="flex flex-wrap gap-3 items-center">
          <div className="rounded-md border px-3 py-2 text-sm font-medium"
            style={{
              background: lowMomentum ? "var(--warn-soft)" : "var(--good-soft)",
              color: lowMomentum ? "var(--warn)" : "var(--good)",
              borderColor: lowMomentum ? "var(--warn)" : "var(--good)"
            }}>
            {lowMomentum
              ? `⚠ Only ${activeCount} active today`
              : `${activeCount} active — good momentum`}
          </div>
          <IconBtn tone="ghost" onClick={addProject}>+ Add project</IconBtn>
        </div>
      </div>
      <div className="grid gap-4 sm:grid-cols-2">
        {projects.length === 0 && (
          <div className="text-sm p-6 rounded-lg border sm:col-span-2" style={{color:"var(--ink-soft)", borderColor:"var(--border)"}}>
            No projects added yet.
          </div>
        )}
        {projects.map(p => <ProjectRow key={p.id} project={p} onUpdate={onUpdate} onDelete={onDelete} />)}
      </div>
    </section>
  );
}

      <div className="flex flex-wrap items-center gap-3">
        <input className="mono text-sm w-20 bg-transparent border-none p-0 focus:ring-0" style={{color:"var(--accent)"}}

        <input className="text-sm font-semibold flex-1 bg-transparent border-none p-0 focus:ring-0" style={{color:"var(--ink)"}}

        <input

          placeholder="Who is this with or from?" 
          style={{color:"var(--ink)"}}
          value={meeting.host || ""} 
          onChange={e=>onUpdate({...meeting, host:e.target.value})} 
        />

      <input
        className="w-full text-sm rounded-md p-2 mt-2"

      />

        <textarea
          className="w-full text-sm rounded-md p-2 resize-y min-h-[56px]"
          placeholder="What is needed before walking in?"

function MeetingBriefs({meetings, onUpdate, onAdd, onDelete}){
  const addMeeting = () => onAdd({time:"", title:"", host:"", link:"", brief:""});

  // Bulletproof sorting (so undefined times don't crash)
  const sortedMeetings = meetings.slice().sort((a,b) => {
    const tA = a.time || "";
    const tB = b.time || "";
    return tA.localeCompare(tB);
  });

  return (
    <section>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div>
          <h2 className="text-lg font-semibold">Meeting & Context Briefs</h2>
          <p className="text-sm" style={{color:"var(--ink-soft)"}}>Today's schedule, with what is actually needed.</p>
        </div>
        <IconBtn tone="ghost" onClick={addMeeting}>+ Add meeting</IconBtn>
      </div>
      <div className="flex flex-col gap-3">
        {meetings.length === 0 && (
          <div className="text-sm p-6 rounded-lg border" style={{color:"var(--ink-soft)", borderColor:"var(--border)"}}>
            No meetings added yet.
          </div>
        )}
        {sortedMeetings.map(m => (
          <MeetingRow key={m.id} meeting={m} onUpdate={onUpdate} onDelete={onDelete} />
        ))}
      </div>
    </section>
  );
}

function buildEodReport({messages, projects, meetings}){
  // Bulletproof filtering
  const completed = projects.filter(p => p.lastTask && typeof p.lastTask === 'string' && p.lastTask.trim());
  const active = projects.filter(p => p && p.activeToday);
  const pending = messages.filter(m => m.status==="backlog" || m.status==="rewrite");
  const date = new Date().toLocaleDateString(undefined, {weekday:"long", year:"numeric", month:"long", day:"numeric"});

  const lines = [];
  lines.push(`EOD Sync — ${date}`, "");

  lines.push("COMPLETED TASKS");
  if(completed.length === 0){ lines.push("— none logged"); }
  else completed.forEach(p => lines.push(`- ${p.name || "Untitled"}: ${p.lastTask}${p.nextStep ? ` (next: ${p.nextStep})` : ""}`));
  lines.push("");

  lines.push("ACTIVE PROJECTS");
  if(active.length === 0){ lines.push("— none marked active today"); }
  else active.forEach(p => lines.push(`- ${p.name || "Untitled"}`));
  lines.push("");

  lines.push("PENDING APPROVALS");
  if(pending.length === 0){ lines.push("— inbox clear"); }
  else pending.forEach(m => {
    const meta = STATUS_META[m.status] || STATUS_META.backlog;
    lines.push(`- [${m.channel || "Work"}] ${m.from || "Unknown sender"} — ${meta.label}`);
  });
  lines.push("");

  lines.push(`Report generated ${fmtTime(nowIso())}`);
  lines.push(`Meetings held: ${meetings.length}`);

  return lines.join("\n");
}

function EodSync({messages, projects, meetings}){
  const [copied, setCopied] = useState(false);
  const autoReport = useMemo(()=>buildEodReport({messages, projects, meetings}), [messages, projects, meetings]);
  
  const [manualEdit, setManualEdit] = useState(null);
  
  const currentText = manualEdit !== null ? manualEdit : autoReport;

  const copyReport = () => {
    copyToClipboard(currentText || "");
    setCopied(true);
    setTimeout(()=>setCopied(false), 1600);
  };

  return (
    <section>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div>
          <h2 className="text-lg font-semibold">End-of-Day Sync</h2>
          <p className="text-sm" style={{color:"var(--ink-soft)"}}>Auto-compiled. Edit below before copying if needed.</p>
        </div>
        <div className="flex gap-2">
          {manualEdit !== null && (
            <IconBtn tone="ghost" onClick={()=>setManualEdit(null)}>Reset to Auto</IconBtn>
          )}
          <IconBtn tone="accent" onClick={copyReport}>{copied ? "Copied ✓" : "Copy EOD Report"}</IconBtn>
        </div>
      </div>
      
      <textarea 
        className="mono text-sm w-full whitespace-pre-wrap rounded-lg border p-4 leading-relaxed resize-y min-h-[250px]"
        style={{background:"var(--panel2)", borderColor:"var(--border)", color:"var(--ink)"}}
        value={currentText || ""}
        onChange={(e) => setManualEdit(e.target.value)}
      />
    </section>
  );
}

function LoadingScreen({label="Loading…"}){
  return (
    <div className="min-h-screen flex items-center justify-center" style={{background:"var(--bg)", color:"var(--ink-soft)"}}>
      <div className="text-sm mono">{label}</div>
    </div>
  );
}

function LoginScreen(){
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if(pin.length !== 6){ setError("Enter all 6 digits."); return; }
    setBusy(true); setError("");
    try{
      await window.FB.signIn(pin);
    }catch(err){
      setError("Invalid PIN / Access Denied");
      setPin("");
    }finally{
      setBusy(false);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-4" style={{background:"var(--bg)"}}>
      <form onSubmit={submit} className="w-full max-w-xs rounded-lg border p-6 flex flex-col gap-4"
        style={{background:"var(--panel)", borderColor:"var(--border)"}}>
        <div className="text-center">
          <div className="text-xs mono tracking-wide" style={{color:"var(--accent)"}}>COMMAND CENTER</div>
          <div className="text-sm mt-1" style={{color:"var(--ink-soft)"}}>Enter the 6-digit access PIN</div>
        </div>
        <input
          autoFocus
          type="password"
          inputMode="numeric"
          pattern="[0-9]*"
          maxLength={6}
          value={pin}
          onChange={e=>{ setPin(e.target.value.replace(/\D/g,"").slice(0,6)); setError(""); }}
          className="text-center text-2xl tracking-[0.5em] rounded-md p-3 mono"
          placeholder="——————"
        />
        {error && <div className="text-sm text-center" style={{color:"var(--warn)"}}>{error}</div>}
        <IconBtn type="submit" tone="accent" disabled={busy || pin.length!==6}>
          {busy ? "Checking…" : "Unlock"}
        </IconBtn>
      </form>
    </div>
  );
}

function AuthGate(){
  const [user, setUser] = useState(undefined); 
  useEffect(() => {
    const unsub = window.FB.onAuthStateChanged(u => setUser(u || null));
    return () => unsub();
  }, []);

  if(user === undefined) return <LoadingScreen />;
  if(user === null) return <LoginScreen />;
  return <App onSignOut={()=>window.FB.signOut()} />;
}

function FirebaseBoot({children}){
  const [ready, setReady] = useState(typeof window.FB !== "undefined");
  useEffect(() => {
    if(ready) return;
    const handler = () => setReady(true);
    window.addEventListener("firebase-ready", handler);
    return () => window.removeEventListener("firebase-ready", handler);
  }, [ready]);
  return ready ? children : <LoadingScreen label="Connecting…" />;
}

function App({onSignOut}){
  const [theme, setTheme] = useTheme();
  
  const msgFS = useFirestoreCollection("messages_live", SEED_MESSAGES);
  const projFS = useFirestoreCollection("projects_live", SEED_PROJECTS);
  const meetFS = useFirestoreCollection("meetings_live", SEED_MEETINGS);

  // Bulletproof initialization
  const messages = msgFS.items || [];
  const projects = projFS.items || [];
  const meetings = meetFS.items || [];

  const backlogCount = messages.filter(m=>m && (m.status==="backlog"||m.status==="rewrite")).length;

  return (
    <div className="max-w-6xl mx-auto px-4 sm:px-6 py-8" style={{scrollPaddingTop:"env(safe-area-inset-top,0px)"}}>
      <header className="flex flex-wrap items-start justify-between gap-4 mb-10 pb-6 border-b" style={{borderColor:"var(--border)"}}>
        <div>
          <div className="text-xs mono tracking-wide" style={{color:"var(--accent)"}}>COMMAND CENTER</div>
          <h1 className="text-2xl font-semibold mt-1">One place for what is needed today</h1>
          <p className="text-sm mt-1" style={{color:"var(--ink-soft)"}}>
            {new Date().toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"})}
          </p>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          {backlogCount > 0 && (
            <Pill tone="warn">{backlogCount} message{backlogCount>1?"s":""} waiting on a response</Pill>
          )}
          <button
            onClick={()=>setTheme(theme==="dark" ? "light" : "dark")}
            className="text-xs font-medium px-3 py-1.5 rounded-full border shrink-0"
            style={{background:"var(--panel2)", color:"var(--ink-soft)", borderColor:"var(--border)"}}>
            {theme==="dark" ? "☾ Dark" : "☼ Light"} — switch
          </button>
          <button
            onClick={onSignOut}
            className="text-xs font-medium px-3 py-1.5 rounded-full border shrink-0"
            style={{background:"var(--panel2)", color:"var(--ink-soft)", borderColor:"var(--border)"}}>
            Sign out
          </button>
        </div>
      </header>

      <div className="flex flex-col gap-14">
        <MessageTriage messages={messages} onUpdate={msgFS.update} onAdd={msgFS.add} onDelete={msgFS.remove} />
        <StandUp projects={projects} onUpdate={projFS.update} onAdd={projFS.add} onDelete={projFS.remove} />
        <MeetingBriefs meetings={meetings} onUpdate={meetFS.update} onAdd={meetFS.add} onDelete={meetFS.remove} />
        <EodSync messages={messages} projects={projects} meetings={meetings} />
      </div>

      <footer className="mt-14 pt-6 border-t text-xs" style={{borderColor:"var(--border)", color:"var(--ink-soft)"}}>
        Synced in real time via Firestore.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<FirebaseBoot><AuthGate /></FirebaseBoot>);
</script>
</body>
</html>
